[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/"
  to = "/airbnb-dashboard.html"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Always revalidate the page itself. Without this, iOS Safari (especially when
# the dashboard is saved to the Home Screen) can keep serving a cached copy for
# days, so a device silently runs old code and misses fixes.
[[headers]]
  for = "/airbnb-dashboard.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# The daily compliance reminder schedule (8:00 AM Pacific / 15:00 UTC) now lives
# in netlify/functions/compliance-reminder.mjs as `export const config`, which is
# how v2 functions declare it. Declaring it here too would duplicate it.
